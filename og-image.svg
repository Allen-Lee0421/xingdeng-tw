<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06080f"/>
      <stop offset="50%" style="stop-color:#0c1120"/>
      <stop offset="100%" style="stop-color:#070a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00e5c8"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(0,229,200,0.05)" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <!-- Glow orbs -->
  <circle cx="200" cy="300" r="200" fill="rgba(0,229,200,0.06)" filter="url(#glow)"/>
  <circle cx="1000" cy="200" r="250" fill="rgba(255,45,120,0.04)" filter="url(#glow)"/>
  <circle cx="600" cy="500" r="180" fill="rgba(168,85,247,0.04)" filter="url(#glow)"/>
  <!-- SNT Logo -->
  <rect x="60" y="60" width="70" height="70" rx="16" fill="none" stroke="url(#accent)" stroke-width="2"/>
  <text x="95" y="107" font-family="monospace" font-size="28" font-weight="bold" fill="#fbbf24" text-anchor="middle">SNT</text>
  <!-- Brand name -->
  <text x="150" y="95" font-family="sans-serif" font-size="20" fill="#94a3b8">光耀星樞</text>
  <text x="150" y="118" font-family="monospace" font-size="12" fill="#64748b">Singularity Nexus Technology</text>
  <!-- Main headline -->
  <text x="600" y="270" font-family="sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle">AI 雲端辦公室建置</text>
  <text x="600" y="340" font-family="sans-serif" font-size="28" fill="#00e5c8" text-anchor="middle">讓 AI 處理重複工作，讓團隊專注創造價值</text>
  <!-- Subtitle -->
  <text x="600" y="400" font-family="sans-serif" font-size="18" fill="#94a3b8" text-anchor="middle">六大 AI 數位員工 · 24H 自動運行 · 5 天快速上線</text>
  <!-- CTA boxes -->
  <rect x="340" y="450" width="160" height="50" rx="12" fill="rgba(0,229,200,0.15)" stroke="rgba(0,229,200,0.4)" stroke-width="1"/>
  <text x="420" y="482" font-family="sans-serif" font-size="16" font-weight="bold" fill="#00e5c8" text-anchor="middle">免費諮詢</text>
  <rect x="520" y="450" width="160" height="50" rx="12" fill="rgba(251,191,36,0.15)" stroke="rgba(251,191,36,0.4)" stroke-width="1"/>
  <text x="600" y="482" font-family="sans-serif" font-size="16" font-weight="bold" fill="#fbbf24" text-anchor="middle">NT$15,000 起</text>
  <rect x="700" y="450" width="160" height="50" rx="12" fill="rgba(168,85,247,0.15)" stroke="rgba(168,85,247,0.4)" stroke-width="1"/>
  <text x="780" y="482" font-family="sans-serif" font-size="16" font-weight="bold" fill="#a855f7" text-anchor="middle">查看方案</text>
  <!-- Bottom bar -->
  <text x="600" y="570" font-family="monospace" font-size="14" fill="#64748b" text-anchor="middle">xingdeng.tw</text>
  <!-- Decorative line -->
  <line x1="100" y1="540" x2="1100" y2="540" stroke="rgba(0,229,200,0.1)" stroke-width="1"/>
</svg>
